cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2


# ===== Font =====
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ===== Shell =====
shell zsh

# ===== Transparency & Blur =====
background_opacity 0.75
dynamic_background_opacity yes
background_blur 100

# ===== Cursor =====
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 1
cursor_trail_decay 0.1 0.4

# ===== Window =====
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# ===== Tab bar =====
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# ===== Scrollback =====
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ===== Performance =====
repaint_delay    8
input_delay      2
sync_to_monitor  yes



# Font settings (Nerd Font for icons)
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# High-contrast ANSI colors for Kitty
# Black / Grey
color0  #1e1e2e
color8  #585b70

# Red (C files, Archives)
color1  #f38ba8
color9  #f38ba8

# Green (Executables, Scripts)
color2  #a6e3a1
color10 #a6e3a1

# Yellow (Headers, Configs)
color3  #f9e2af
color11 #f9e2af

# Blue (Directories)
color4  #89b4fa
color12 #89b4fa

# Magenta (Lua, Special files)
color5  #cba6f7
color13 #cba6f7

# Cyan (Symlinks)
color6  #94e2d5
color14 #94e2d5

# White (Regular Files)
color7  #cdd6f4
color15 #ffffff
